[package]
name = "ratodo"
version = "0.7.2"
edition = "2024"
rust-version = "1.88"
description = "A todo TUI, built with ratatui — one Markdown file, no cloud, no account."
repository = "https://github.com/murat-akpinar/ratodo"
license = "GPL-3.0-only"
readme = "README.md"
keywords = ["todo", "tui", "markdown", "cli", "productivity"]
categories = ["command-line-utilities"]

# `docs/` stays in — it is the decision record, it is what this project is, and
# `docs/examples/todo.md` is the fixture a test keeps in sync. What goes is the
# machinery of working *on* it, which nobody installing the binary needs —
# `assets/` included, because the README points at the GIF by URL and would
# carry a third of a megabyte into every install for nothing.
exclude = [
    ".vscode/",
    "assets/",
    "CLAUDE.md",
    "cliff.toml",
    "flake.nix",
    "notes.md",
    "packaging/",
    "scripts/",
    "todo.md",
    "tui/",
]

# Dependencies are added when the step that needs them arrives, so the build
# stays fast while the pure-function core is being written. The full approved
# list — and what is deliberately absent — is in docs/architecture.md.
#   step 4 (TUI):  ratatui, crossterm, notify
[dependencies]
anyhow = "1"
chrono = { version = "0.4", default-features = false, features = ["std", "clock"] }
clap = { version = "4", features = ["derive"] }
# Must stay on the version ratatui re-exports, or key events cross a type
# boundary that looks identical and is not. `cargo tree -i crossterm` says one.
crossterm = "0.29"
directories = "6"
notify = "8.2.0"
# No default features: they bring a calendar widget and its own date crate, on
# top of the chrono we already have. See docs/architecture.md#dependencies.
ratatui = { version = "0.30", default-features = false, features = ["crossterm", "layout-cache"] }

[profile.release]
strip = true
lto = true
codegen-units = 1
